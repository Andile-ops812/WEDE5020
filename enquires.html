<!DOCTYPE html>
<html lang="en">

<!-- ============================================================
     PAGE: Enquiries (enquires.html)
     DESCRIPTION: Allows visitors to submit an enquiry to
     Mercedes-Benz via an embedded Google Form. The form
     collects customer details and queries which are sent
     directly to the business.
     AUTHOR: [Andile Ndlovu]
     STUDENT NUMBER: [ST10452270]
     MODULE: WEDE5020
     DATE:25 May 2026
     ============================================================ -->

<head>
  <!-- Sets the character encoding so all characters display correctly -->
  <meta charset="UTF-8">

  <!-- Makes the page scale correctly on mobile and tablet screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Description shown in Google search results (SEO) -->
  <meta name="description" content="Submit an enquiry to Mercedes-Benz South Africa.
  Ask about vehicle availability, pricing, test drives, or financing options.">

  <!-- Keywords to help search engines find this page (SEO) -->
  <meta name="keywords" content="Mercedes-Benz enquiry, contact form, vehicle enquiry,
  South Africa, test drive, financing">

  <!-- Author (SEO) -->
  <meta name="author" content="Andile Ndlovu">

  <!-- Open Graph tags for social sharing (SEO) -->
  <meta property="og:title" content="Enquiries | Mercedes-Benz">
  <meta property="og:description" content="Submit an enquiry to Mercedes-Benz South Africa. Ask about vehicle availability, pricing, test drives, or financing options.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/Image1 Apr 17, 2026, 03_42_57 PM.png">

  <!-- Title shown in the browser tab -->
  <title>Enquiries | Mercedes-Benz</title>

  <!-- Links the external CSS stylesheet to this HTML page -->
  <link rel="stylesheet" href="css_assets/mystyles.css">

  <!-- External JS — handles navigation, animations, forms (Part 3) -->
  <script src="js_assets/main.js" defer></script>
</head>

<body>

  <!-- ============================================================
       HEADER: Contains the Mercedes-Benz logo banner and the main
       navigation menu. Identical across all five pages.
       ============================================================ -->
  <header>

    <!-- Site banner / logo image -->
    <img src="images/Image1 Apr 17, 2026, 03_42_57 PM.png" alt="Mercedes-Benz Logo Banner">

    <!-- ========================================================
         NAVIGATION MENU: Links to all 5 pages of the website.
         class="active" marks Enquiries as the current page.
         ======================================================== -->
    <nav>
      <!-- Hamburger button — visible on mobile only, hidden on desktop via CSS -->
      <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="about_us.html">About</a></li>
        <li><a href="products.html">Products</a></li>
        <!-- Enquiries is the active/current page -->
        <li><a href="enquires.html" class="active">Enquiries</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <!-- ===== END NAVIGATION ===== -->

  </header>
  <!-- ===== END HEADER ===== -->

  <!-- ============================================================
       MAIN: Unique content for the Enquiries page only.
       Contains a page heading and an embedded Google Form.
       ============================================================ -->
  <main>

    <!-- ==========================================================
         PAGE HEADING: The single h1 for this page — tells the user
         what this page is for before the form loads.
         ========================================================== -->
    <h1>Enquiries</h1>

    <!-- Brief instruction paragraph to guide the visitor -->
    <p>
      Please complete the form below to enquire about any of our vehicles, services,
      or dealership offerings. We will get back to you as soon as possible.
    </p>

    <!-- ==========================================================
         ENQUIRY FORM SECTION: A real HTML form that allows visitors
         to enquire about a specific model or tier (Mercedes-Benz,
         AMG, or Maybach) and submit their contact details and
         message. Replaces the previous embedded Google Form, which
         could not be validated or processed with this site's own
         JavaScript. Inputs and IDs are ready for client-side
         validation and a dynamic response (added in Part 3).
         ========================================================== -->
    <section>
      <h2>Submit Your Enquiry</h2>

      <form id="enquiryForm" class="enquiry-form" onsubmit="return handleEnquirySubmit(event);">

        <!-- Full name input -->
        <label for="enquiryName">Full Name</label>
        <input type="text"
               id="enquiryName"
               name="enquiryName"
               placeholder="Your full name"
               required>
        <!-- Error message will be shown here by JavaScript (Part 3) -->
        <span class="error-msg" id="enquiryNameError"></span>

        <!-- Email address input -->
        <label for="enquiryEmail">Email</label>
        <input type="email"
               id="enquiryEmail"
               name="enquiryEmail"
               placeholder="Your email address"
               required>
        <span class="error-msg" id="enquiryEmailError"></span>

        <!-- What the visitor is enquiring about -->
        <label for="enquirySubject">What are you enquiring about?</label>
        <select id="enquirySubject" name="enquirySubject" required>
          <option value="" disabled selected>Please select an option</option>
          <option value="mercedes-benz">Mercedes-Benz (C-Class, E-Class, GLE)</option>
          <option value="amg">AMG (C63, G63, GT)</option>
          <option value="maybach">Maybach (S580, GLS 600)</option>
          <option value="test-drive">Test Drive Booking</option>
          <option value="financing">Financing Options</option>
          <option value="other">Other</option>
        </select>
        <span class="error-msg" id="enquirySubjectError"></span>

        <!-- Message textarea -->
        <label for="enquiryMessage">Message</label>
        <textarea id="enquiryMessage"
                  name="enquiryMessage"
                  placeholder="Tell us more about your enquiry"
                  rows="5"
                  required></textarea>
        <span class="error-msg" id="enquiryMessageError"></span>

        <!-- Submit button -->
        <button type="submit">Submit Enquiry</button>

      </form>

      <!-- ========================================================
           RESPONSE MESSAGE: Hidden by default. Shown by JavaScript
           (added in Part 3) after a successful, validated submission,
           with a dynamic message about cost and availability based
           on the selected tier above.
           ======================================================== -->
      <div id="enquiryResponse" class="response-message" style="display:none;"></div>

    </section>
    <!-- ===== END ENQUIRY FORM SECTION ===== -->

  </main>
  <!-- ===== END MAIN CONTENT ===== -->

  <!-- ============================================================
       FOOTER: Appears on ALL five pages of the website.
       Contains the copyright notice for Mercedes-Benz.
       ============================================================ -->
  <footer>
    <p>Mercedes-Benz &copy;&trade; 2026</p>
  </footer>
  <!-- ===== END FOOTER ===== -->

  <!-- External JS — handles navigation, animations, forms -->
  <script src="js_assets/main.js"></script>

</body>
</html>
